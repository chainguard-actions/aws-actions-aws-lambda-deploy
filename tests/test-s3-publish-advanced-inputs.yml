name: Test Zip deploy via S3 with publish and advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create code artifacts
        run: |
          mkdir -p lambda-src
          echo "exports.handler = async () => 'ok';" > lambda-src/index.js
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 10
        with:
          function-name: actionchain-harness-test-fn
          code-artifacts-dir: lambda-src
          role: arn:aws:iam::123456789012:role/lambda-role
          function-description: Harness test function
          architectures: arm64
          publish: 'true'
          revision-id: 00000000-0000-0000-0000-000000000000
          s3-bucket: actionchain-harness-nonexistent-bucket
          s3-key: lambda-deployments/test/fn.zip
      - name: Assert action deployed, or failed gracefully without AWS credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARN: ${{ steps.action.outputs.function-arn }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "function-arn: $ARN"
          echo "version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            case "$ARN" in
              arn:aws*:lambda:*:function:actionchain-harness-test-fn*)
                echo "PASS: got function ARN '$ARN'" ;;
              *)
                echo "FAIL: action succeeded but function-arn is invalid: '$ARN'"
                exit 1 ;;
            esac
            if [ -z "$VERSION" ]; then
              echo "FAIL: publish=true but no version output"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action passed validation and failed gracefully (no AWS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
