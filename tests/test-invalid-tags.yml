name: Test tags as array is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create code artifacts
        run: |
          mkdir -p lambda-src
          echo "exports.handler = async () => ({ statusCode: 200 });" > lambda-src/index.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          function-name: test-function
          code-artifacts-dir: lambda-src
          tags: '["Environment","Production"]'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARN: ${{ steps.action.outputs.function-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "function-arn: $ARN"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for array tags"
            exit 1
          fi
          if [ -n "$ARN" ]; then
            echo "FAIL: function-arn should be empty"
            exit 1
          fi
          echo "PASS"
