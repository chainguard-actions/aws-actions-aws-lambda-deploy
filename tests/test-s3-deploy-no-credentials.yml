name: Test valid S3 deployment inputs fail cleanly without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_REGION: ""
          AWS_DEFAULT_REGION: ""
        with:
          function-name: test-fn
          code-artifacts-dir: tests
          s3-bucket: my-test-deploy-bucket
          s3-key: lambda-deployments/test-fn/test.zip
          publish: 'true'
          revision-id: 00000000-0000-0000-0000-000000000000
          architectures: arm64
          function-description: Test function deployed by act
      - name: Assert action failed at the AWS call with no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARN: ${{ steps.action.outputs.function-arn }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "arn: $ARN"
          echo "version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without AWS region/credentials"
            exit 1
          fi
          if [ -n "$ARN" ] || [ -n "$VERSION" ]; then
            echo "FAIL: outputs should be empty"
            exit 1
          fi
          echo "PASS"
