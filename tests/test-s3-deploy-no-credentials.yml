name: Test S3 deploy with valid inputs but no AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create code artifacts
        run: |
          mkdir -p lambda-src
          echo "exports.handler = async () => ({ statusCode: 200 });" > lambda-src/index.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          function-name: actionchain-harness-nonexistent-fn
          code-artifacts-dir: lambda-src
          function-description: Harness test function
          publish: "true"
          revision-id: 00000000-0000-0000-0000-000000000000
          architectures: arm64
          s3-bucket: actionchain-harness-nonexistent-bucket
          s3-key: lambda-deployments/test/test.zip
          memory-size: "256"
          timeout: "30"
          ephemeral-storage: "1024"
          tags: '{"Environment":"Test"}'
      - name: Assert action failed without credentials and produced no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARN: ${{ steps.action.outputs.function-arn }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "function-arn: $ARN"
          echo "version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without AWS credentials"
            exit 1
          fi
          if [ -n "$ARN" ] || [ -n "$VERSION" ]; then
            echo "FAIL: outputs should be empty"
            exit 1
          fi
          echo "PASS"
