name: Test non-numeric ephemeral-storage is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          function-name: test-fn
          code-artifacts-dir: tests
          ephemeral-storage: huge
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARN: ${{ steps.action.outputs.function-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "arn: $ARN"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-numeric ephemeral-storage"
            exit 1
          fi
          if [ -n "$ARN" ]; then
            echo "FAIL: function-arn should be empty"
            exit 1
          fi
          echo "PASS"
